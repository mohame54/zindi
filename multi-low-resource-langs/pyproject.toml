[project]
name = "multi-low-resource-langs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "gdown>=6.0.0",
    "matplotlib>=3.9.4",
    "pandas>=2.3.3",
    "peft>=0.14.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.14.0",
    "torch>=2.8.0",
    "transformers>=5.0.0",
    "trl>=1.4.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
